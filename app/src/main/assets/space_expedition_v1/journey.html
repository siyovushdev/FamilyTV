<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1920, height=1080, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<style>
@font-face {
  font-family: "Plus Jakarta Sans";
  src: url("fonts/PlusJakartaSans.ttf") format("truetype");
  font-weight: 500 800; font-style: normal; font-display: swap;
}
html, body { margin: 0; padding: 0; overflow: hidden; width: 1920px; height: 1080px; }
body { font-family: "Plus Jakarta Sans", sans-serif; background: #080d1e; color: #dde1fa; user-select: none; }
.svg-icon { width: 1em; height: 1em; display: inline-block; vertical-align: middle; fill: currentColor; }
.stage {
  position: relative; width: 1920px; height: 1080px; overflow: hidden;
  background: #080d1e; padding: 72px 88px; box-sizing: border-box;
  display: flex; flex-direction: column;
}
.bg { position: absolute; left: -88px; right: -88px; top: -72px; bottom: -72px; z-index: 0; }
.bg img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
.veil-a { position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,13,30,0.85), transparent, rgba(8,13,30,0.55)); mix-blend-mode: multiply; opacity: 0.85; }
.veil-b { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(6,10,23,0.40), transparent, rgba(6,10,23,0.90)); }
.hud { position: relative; z-index: 30; display: flex; align-items: center; justify-content: space-between; }
.pill {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 24px; border-radius: 9999px;
  background: rgba(24,37,75,0.70); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 16px 32px rgba(0,0,0,0.4);
  font-size: 24px; font-weight: 600;
}
.pill .svg-icon { color: #5ff6ee; }
.pdu { padding: 2px 8px; border-radius: 9999px; background: rgba(47,52,71,0.80); font-size: 16px; color: #bacac8; text-transform: uppercase; }
.guide {
  display: flex; align-items: center; gap: 16px;
  padding: 8px 32px; border-radius: 9999px;
  background: rgba(34,50,96,0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.5); max-width: 1100px;
}
.avatar {
  position: relative; width: 48px; height: 48px; border-radius: 9999px; flex: 0 0 48px;
  background: rgba(56,217,210,0.16); color: #5ff6ee;
  display: flex; align-items: center; justify-content: center; font-size: 30px;
}
.ping { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 9999px; background: #5ff6ee; }
.kicker { font-size: 16px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5ff6ee; }
.guide-line { font-size: 24px; line-height: 32px; font-weight: 600; }
.meter { display: flex; align-items: center; gap: 12px; padding: 8px 24px; border-radius: 9999px; background: rgba(24,37,75,0.70); }
.meter-k { font-size: 16px; color: #bacac8; text-transform: uppercase; }
.meter-v { font-size: 24px; font-weight: 700; color: #5ff6ee; }
.world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 20; pointer-events: none; }
.trail { position: absolute; inset: 0; }
.dest {
  position: absolute; display: flex; flex-direction: column; align-items: center;
  pointer-events: auto; transform: translate(-50%, -50%);
}
.orb {
  position: relative; width: 96px; height: 96px; border-radius: 9999px;
  background: rgba(24,37,75,0.90); box-shadow: 0 16px 32px rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.inner { width: 64px; height: 64px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
.mark {
  position: absolute; bottom: -8px; right: -8px; width: 32px; height: 32px; border-radius: 9999px;
  display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;
}
.label { margin-top: 8px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.chip { padding: 2px 12px; border-radius: 9999px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.name { font-size: 24px; font-weight: 700; margin-top: 4px; text-shadow: 0 4px 12px rgba(0,0,0,0.6); }
.dest.COMPLETED .inner { background: rgba(52,211,153,0.20); color: #34d399; }
.dest.COMPLETED .mark { background: #fbbf24; color: #2a1700; }
.dest.COMPLETED .chip { background: rgba(52,211,153,0.20); color: #34d399; }
.dest.CURRENT { z-index: 30; }
.dest.CURRENT .orb { width: 128px; height: 128px; background: rgba(34,50,96,0.95); }
.dest.CURRENT .inner { width: 96px; height: 96px; background: #5ff6ee; color: #003735; font-size: 52px; }
.dest.CURRENT .here {
  position: absolute; bottom: -12px; padding: 2px 12px; border-radius: 9999px;
  background: #5ff6ee; color: #003735; font-size: 16px; font-weight: 800; letter-spacing: 0.06em;
}
.dest.CURRENT .card {
  margin-top: 16px; padding: 8px 24px; border-radius: 12px;
  background: rgba(34,50,96,0.95); box-shadow: 0 16px 32px rgba(0,0,0,0.5);
}
.dest.CURRENT .card .chip { background: transparent; color: #5ff6ee; padding: 0; }
.dest.CURRENT .card .name { font-size: 32px; }
.halo {
  position: absolute; inset: -24px; border-radius: 9999px;
  background: rgba(95,246,238,0.25); filter: blur(22px); animation: pulse 1.6s ease-in-out infinite;
}
.ship-tag {
  position: absolute; top: -56px; display: flex; align-items: center; gap: 6px;
  padding: 4px 16px; border-radius: 9999px; background: #5ff6ee; color: #003735;
  font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  animation: bounce 1.4s ease-in-out infinite;
}
.dest.AVAILABLE .inner { background: rgba(123,208,255,0.18); color: #7bd0ff; }
.dest.AVAILABLE .chip { background: rgba(34,50,96,0.90); color: #7bd0ff; }
.dest.LOCKED { opacity: 0.72; }
.dest.LOCKED .inner { background: rgba(22,27,44,0.80); color: #fbbf24; }
.dest.LOCKED .mark { background: #2f3447; color: #bacac8; }
.dest.LOCKED .chip { background: rgba(34,50,96,0.95); color: #fbbf24; }
.dest.MISSING { opacity: 0.55; }
.dest.win .orb { background: linear-gradient(to top right, #fbbf24, #ffb553, #fb7185); }
.dest.win .inner { background: transparent; color: #080d1e; }
.dest.win .chip { background: rgba(251,191,36,0.20); color: #fbbf24; }
.foot {
  position: relative; z-index: 30; margin-top: auto;
  display: flex; align-items: center; justify-content: space-between;
}
.cta {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 48px; border-radius: 9999px;
  background: #5ff6ee; color: #003735;
  font-size: 32px; line-height: 40px; font-weight: 700;
  box-shadow: 0 16px 40px rgba(56,217,210,0.45);
  transform: scale(1.05);
}
.cta .ok { padding: 4px 10px; border-radius: 4px; background: #003735; color: #5ff6ee; font-size: 16px; font-weight: 800; }
.side { display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-radius: 9999px; background: rgba(24,37,75,0.80); font-size: 24px; font-weight: 600; }
@keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
</style>
</head>
<body>
<main class="stage">
  <div class="bg">
    <img alt="" id="bg-img" src="journey_bg.jpg"/>
    <div class="veil-a"></div>
    <div class="veil-b"></div>
  </div>
  <header class="hud">
    <div class="pill"><span class="svg-icon"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></span>Назад<span class="pdu">Back</span></div>
    <div class="guide">
      <div class="avatar"><span class="ping"></span><span class="svg-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1112 6a2.5 2.5 0 010 5.5z"/></svg></span></div>
      <div>
        <div class="kicker">Бортовой спутник Луми</div>
        <div class="guide-line" id="guide-line"></div>
      </div>
    </div>
    <div class="meter">
      <div>
        <div class="meter-k">Прогресс</div>
        <div class="meter-v" id="meter">0 / 0</div>
      </div>
    </div>
  </header>
  <div class="world">
    <svg class="trail" viewBox="0 0 1920 1080" preserveAspectRatio="none">
      <path id="rail" fill="none" stroke="rgba(95,246,238,0.35)" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <div id="destinations"></div>
  </div>
  <footer class="foot">
    <div class="cta"><span class="ok">OK</span>
      <span class="svg-icon" style="font-size:44px;"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
      <span id="cta">Продолжить</span>
    </div>
    <div class="side"><span class="svg-icon" style="color:#fbbf24;"><svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg></span><span>Наши открытия</span></div>
  </footer>
</main>
<script>
document.documentElement.style.zoom = String(1 / (window.devicePixelRatio || 1));
const ICONS = {
  launch: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>',
  'moon-hub': '<svg viewBox="0 0 24 24"><path d="M9 2a7 7 0 107 7 9 9 0 01-7-7z"/></svg>',
  'light-lab': '<svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>',
  'temp-lab': '<svg viewBox="0 0 24 24"><path d="M15 13V5c0-1.66-1.34-3-3-3S9 3.34 9 5v8c-1.21.91-2 2.37-2 4 0 2.76 2.24 5 5 5s5-2.24 5-5c0-1.63-.79-3.09-2-4zm-4-8c0-.55.45-1 1-1s1 .45 1 1h-1v1h1v1h-1v1h1v1h-2V5z"/></svg>',
  stretch: '<svg viewBox="0 0 24 24"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>',
  'final-mission': '<svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5z"/></svg>',
  'calm-end': '<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
  'story-side': '<svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>'
};
function chipFor(v) {
  if (v === 'COMPLETED') return 'Пройдено';
  if (v === 'CURRENT') return 'Мы здесь';
  if (v === 'AVAILABLE') return 'Открыто';
  if (v === 'LOCKED') return 'Впереди';
  return 'Скоро';
}
window.renderBoard = function (p) {
  document.getElementById('bg-img').src = p.updated ? 'journey_updated_bg.jpg' : 'journey_bg.jpg';
  document.getElementById('guide-line').textContent = '«' + (p.guide || '') + '»';
  document.getElementById('meter').textContent = (p.requiredDone || 0) + ' / ' + (p.requiredTotal || 0);
  document.getElementById('cta').textContent = p.cta || 'Продолжить';
  const nodes = p.waypoints || [];
  const rail = document.getElementById('rail');
  const pts = nodes.filter(function (n) { return !n.optional; });
  if (pts.length) {
    let d = 'M ' + pts[0].x + ' ' + pts[0].y;
    for (let i = 1; i < pts.length; i++) d += ' Q ' + ((pts[i-1].x+pts[i].x)/2) + ' ' + (Math.min(pts[i-1].y, pts[i].y) - 40) + ' ' + pts[i].x + ' ' + pts[i].y;
    rail.setAttribute('d', d);
  }
  const box = document.getElementById('destinations');
  box.innerHTML = nodes.map(function (n) {
    const vis = n.visual || 'LOCKED';
    const win = p.updated && vis === 'COMPLETED' && n.id === p.lastId;
    const icon = ICONS[n.id] || ICONS.launch;
    const focus = p.focus === ('node:' + n.id);
    if (vis === 'CURRENT') {
      return '<div class="dest CURRENT' + (focus ? ' focus' : '') + '" style="left:' + n.x + 'px;top:' + n.y + 'px;">' +
        '<div class="halo"></div>' +
        '<div class="ship-tag"><span class="svg-icon"><svg viewBox="0 0 24 24"><path d="M12 2.5s6 5.2 6 11.2c0 3.3-2.7 6-6 6s-6-2.7-6-6C6 7.7 12 2.5 12 2.5z"/></svg></span>Северное сияние</div>' +
        '<div class="orb"><div class="inner"><span class="svg-icon">' + icon + '</span></div><div class="here">МЫ ЗДЕСЬ</div></div>' +
        '<div class="card"><span class="chip">АКТИВНО</span><span class="name">' + n.label + '</span></div></div>';
    }
    return '<div class="dest ' + vis + (win ? ' win' : '') + (focus ? ' focus' : '') + '" style="left:' + n.x + 'px;top:' + n.y + 'px;">' +
      '<div class="orb"><div class="inner"><span class="svg-icon">' + icon + '</span></div>' +
      (vis === 'COMPLETED' || vis === 'LOCKED' ? '<div class="mark">' + (vis === 'COMPLETED' ? '✓' : '🔒') + '</div>' : '') +
      '</div><div class="label"><span class="chip">' + (win ? 'Только что' : chipFor(vis)) + '</span><span class="name">' + n.label + '</span></div></div>';
  }).join('');
};
window.renderBoard({guide:'', requiredDone:0, requiredTotal:0, waypoints:[], updated:false, cta:'Продолжить'});
</script>
</body>
</html>
