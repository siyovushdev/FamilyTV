<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/20 text-primary animate-pulse">

</div>

</div>

<div class="relative w-48 h-48 rounded-full flex items-center justify-center bg-surface-container/90 backdrop-blur-md shadow-[0_0_45px_rgba(56,217,210,0.7)] transition-transform duration-300">

<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary/30 via-transparent to-accent-amber/20 pointer-events-none"></div>
<div class="absolute -inset-1.5 rounded-full bg-primary/25 blur-sm animate-pulse pointer-events-none"></div>
<div class="absolute inset-0 rounded-full bg-primary/20 pointer-events-none"></div>
<!-- Physical Golden Key Symbol & Aura -->
<div class="relative flex items-center justify-center w-32 h-32 rounded-full bg-gradient-to-br from-accent-amber/30 to-surface-container-lowest">
<span class="text-[76px] leading-none drop-shadow-[0_8px_20px_rgba(251,191,36,0.6)]">🔑</span>
</div>
<!-- Sparkling Door Synergy Particles -->
<div class="absolute -top-2 -right-2 text-accent-amber text-title-tv animate-spin" style="animation-duration: 8s;">✦</div>

</div>

          Роби с интересом смотрит на золотой ключик
        </span>
</div>
</footer>
</div>
<script>
    (function () {
      const items = ['orb-key', 'orb-map', 'orb-lantern'];
      let currentIndex = 0;

      function updateFocus(newIndex) {
        if (newIndex < 0 || newIndex >= items.length) return;
        currentIndex = newIndex;
        // Simple visual feedback handler for living-room remote
        items.forEach((id, index) => {
          const el = document.getElementById(id);
          if (!el) return;
          if (index === currentIndex) {
            el.classList.add('scale-105', 'opacity-100');
            el.classList.remove('opacity-80');
          } else {
            el.classList.remove('scale-105', 'opacity-100');
            el.classList.add('opacity-80');
          }
        });
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
          updateFocus((currentIndex + 1) % items.length);
        } else if (e.key === 'ArrowLeft') {
          updateFocus((currentIndex - 1 + items.length) % items.length);
        }
      });
    })();
  </script>
