<div class="absolute inset-0 bg-gradient-to-r from-surface-container-lowest/75 via-transparent to-surface-container-lowest/75"></div>
</div>

<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[720px] h-[340px] bg-primary/10 rounded-full blur-[110px] pointer-events-none"></div>
<div class="absolute bottom-16 left-1/2 -translate-x-1/2 w-[980px] h-[260px] bg-secondary-container/15 rounded-full blur-[130px] pointer-events-none"></div>

<div class="relative z-10 flex flex-col justify-between w-full h-full px-margin-safe-x py-margin-safe-y">
<!-- TOP BAR: Navigation Back & Lumi Character Speech Bubble -->
<header class="flex items-center justify-between w-full h-16">
<!-- Back Button with TV D-Pad Focus readiness -->
<button class="flex items-center gap-space-sm px-6 py-3 rounded-full bg-surface-container-high/80 text-on-surface shadow-md hover:bg-surface-variant transition-all duration-200">
<span class="material-symbols-outlined text-subtitle-tv text-primary">arrow_back</span>
<span class="font-subtitle-tv text-subtitle-tv text-on-surface tracking-wide">Назад</span>
</button>
<!-- Lumi Bubble (Centered Guidance) -->
<div class="flex items-center gap-space-md px-8 py-3.5 rounded-full bg-surface-container/90 shadow-xl backdrop-blur-md">
<div class="relative flex items-center justify-center w-10 h-10 rounded-full bg-gradient-to-tr from-accent-amber to-tertiary shadow-[0_0_16px_rgba(251,191,36,0.6)]">
<span class="material-symbols-outlined text-on-tertiary text-title-tv" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-accent-green animate-ping"></span>
</div>
<div class="flex items-baseline gap-2">
<span class="font-title-tv text-subtitle-tv text-accent-amber font-bold">Lumi:</span>
<span class="font-subtitle-tv text-subtitle-tv text-on-surface font-semibold tracking-wide">«Куда Роби отправится в путь?»</span>
</div>
</div>
<!-- Balance spacer to preserve absolute center of Lumi -->
<div class="w-36 h-12 flex items-center justify-end">
<div class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-surface-container-low/70 text-on-surface-variant font-caption-tv text-caption-tv">
<span class="material-symbols-outlined text-primary text-[20px]">tv</span>
<span>Шаг 3 из 5</span>
</div>
</div>
</header>
<!-- CENTER INTERACTIVE ZONE: World Portals Overlaying Canonical Robi Stage -->
<main class="relative flex items-center justify-between w-full my-auto px-4">
<!-- LEFT WORLD: Звёздная станция (Subdued Portal Card) -->
<section class="group flex flex-col items-center w-[360px] p-6 rounded-xl bg-surface-container-low/80 backdrop-blur-md opacity-75 hover:opacity-100 transition-all duration-300">
<div class="relative flex items-center justify-center w-28 h-28 mb-4 rounded-full bg-surface-container-highest shadow-md">
<span class="material-symbols-outlined text-secondary text-[54px]" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
<div class="absolute inset-0 rounded-full bg-secondary/10 blur-sm"></div>
</div>
<h2 class="font-title-tv text-subtitle-tv text-on-surface font-bold text-center mb-1">
          Звёздная станция
        </h2>
<p class="font-body-tv text-caption-tv text-on-surface-variant text-center mb-5">
          Орбита и кольца планет
        </p>
<div class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-surface-container-high/90 text-on-surface-variant font-caption-tv text-caption-tv">
<span class="text-secondary font-bold">◂</span>
<span>Нажми Влево</span>
</div>
</section>
<!-- CENTER WORLD (FOCUSED): Волшебный лес (Highlighted Pill & Action Trigger) -->
<section class="flex flex-col items-center justify-center -mt-6">
<!-- Robi Stage Target Halo -->
<div class="flex flex-col items-center animate-pulse mb-6">
<div class="px-5 py-1.5 rounded-full bg-accent-green/20 text-accent-green font-caption-tv text-caption-tv font-bold tracking-widest uppercase mb-3 shadow-[0_0_20px_rgba(52,211,153,0.3)]">
            ВЫБРАНО
          </div>
<!-- Focused World Header Badge -->
<div class="flex items-center gap-4 px-10 py-3.5 rounded-full bg-surface-container-lowest/90 shadow-[0_0_35px_rgba(56,217,210,0.55)]">
<span class="text-3xl">🌲</span>
<h1 class="font-display-tv text-title-tv text-on-surface font-bold tracking-wide">
              Волшебный лес
            </h1>
</div>
</div>
<!-- Robi Stage Interaction Pad Anchor -->
<div class="h-44 w-full flex items-center justify-center pointer-events-none">
<!-- Empty space preserving focus cleanly on Robi standing in background center stage -->
</div>

<button class="flex items-center gap-3.5 px-10 py-4 rounded-full bg-primary hover:bg-primary-container text-on-primary font-title-tv text-subtitle-tv font-bold shadow-[0_0_30px_rgba(56,217,210,0.65)] hover:scale-105 transition-all duration-200">
<span class="px-2.5 py-0.5 rounded bg-on-primary/15 text-on-primary font-caption-tv text-caption-tv font-extrabold tracking-wider">OK</span>
<span>Отправиться сюда</span>
<span class="material-symbols-outlined text-title-tv">play_arrow</span>
</button>
</section>
<!-- RIGHT WORLD: Таинственный остров (Subdued Portal Card) -->
<section class="group flex flex-col items-center w-[360px] p-6 rounded-xl bg-surface-container-low/80 backdrop-blur-md opacity-75 hover:opacity-100 transition-all duration-300">

<span class="material-symbols-outlined text-accent-coral text-[54px]" style="font-variation-settings: 'FILL' 1;">waves</span>
<div class="absolute inset-0 rounded-full bg-accent-coral/10 blur-sm"></div>
</div>
<h2 class="font-title-tv text-subtitle-tv text-on-surface font-bold text-center mb-1">
          Таинственный остров
        </h2>
<p class="font-body-tv text-caption-tv text-on-surface-variant text-center mb-5">
          Берег и светящиеся ракушки
        </p>
<div class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-surface-container-high/90 text-on-surface-variant font-caption-tv text-caption-tv">
<span>Нажми Вправо</span>
<span class="text-accent-coral font-bold">▸</span>
</div>
</section>
</main>
<!-- BOTTOM BAR: Minimal Stepper Dots & Status Notification -->
<footer class="flex items-center justify-between w-full h-12 pt-2">
<!-- Status Badge -->
<div class="flex items-center gap-2.5 px-5 py-2 rounded-full bg-surface-container-low/90 backdrop-blur-md shadow-sm">
<span class="w-2.5 h-2.5 rounded-full bg-accent-green animate-pulse"></span>
<span class="font-body-tv text-caption-tv text-on-surface-variant font-semibold tracking-wide">
          Роби готов к приключению!
        </span>
</div>

<div class="flex items-center gap-3 px-6 py-2 rounded-full bg-surface-container-lowest/80 backdrop-blur-md">
<div class="w-2.5 h-2.5 rounded-full bg-outline-variant transition-all"></div>
<div class="w-8 h-3 rounded-full bg-primary shadow-[0_0_12px_rgba(56,217,210,0.8)] transition-all"></div>
<div class="w-2.5 h-2.5 rounded-full bg-outline-variant transition-all"></div>
</div>
<!-- Ambient Remote Hint -->
<div class="flex items-center gap-2 text-on-surface-variant/80 font-caption-tv text-caption-tv">
<span class="material-symbols-outlined text-[18px]">touch_app</span>
<span>Выберите мир пультом</span>
</div>
</footer>
</div>
</div>
<script>
  // Remote Control (D-Pad) Key Handling for seamless Android TV experience
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') {
      console.log('Navigate Left: Звёздная станция');
    } else if (e.key === 'ArrowRight') {
      console.log('Navigate Right: Таинственный остров');
    } else if (e.key === 'Enter') {
      console.log('Confirm: Волшебный лес chosen');
    }
  });
</script></main></body></html>
