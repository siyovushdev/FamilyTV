<!-- Full-bleed Bedtime Story Finale Illustration -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida/AEtjO1WVhf_c53wQ7noP3OCgkNhfuzwY_aiPSPDEWh1cEJWPa-3IkNdEeXNG1go0RiYWtO25u2MjTyW18XJXZwq9t6SH8XAzey3WndIenSFgVS0JTLUfn0kL98rwcXp2ciWMkaIWKcsRtDtSYBiB7a4pKW9XTCddMNmDHXxdbHsTZLY7OZYunuFFmUMRJ26KQI78WeLFbuH3MkuLl1KoOQP4LTTwoDfEWzI66ow8bXPUcUWxJJ0wKA88hzD8ag');">
</div>
<!-- Soft Ambient Cosmic Scrims for TV Viewability and Cozy Contrast -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-surface-dim/40 to-surface-dim/80 pointer-events-none"></div>
<div class="absolute inset-0 bg-radial from-transparent via-transparent to-surface-container-lowest/90 pointer-events-none"></div>
<!-- Subtle Floating Starlight Glow Accents -->
<div class="absolute top-1/4 left-1/3 w-96 h-96 bg-primary-fixed-dim/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-1/3 right-1/4 w-80 h-80 bg-accent-amber/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- 10-Foot Safe Area TV Container -->
<div class="relative z-10 flex flex-col justify-between w-full h-full px-[88px] py-[72px]">
<!-- Top Bar: Navigation, Gentle Narration Pill, and Sleep Atmosphere Badge -->
<header class="flex items-center justify-between w-full">
<!-- Back to Studio Action -->
<button class="group flex items-center space-x-space-xs px-space-lg py-space-sm rounded-full bg-surface-container-low/85 backdrop-blur-md shadow-md text-on-surface hover:text-primary transition-all duration-200 focus:outline-none focus:bg-surface-container focus:text-primary focus:shadow-[0_0_24px_rgba(56,217,210,0.5)]" id="btn-workshop" tabindex="0">
<span class="material-symbols-outlined text-[28px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="font-subtitle-tv text-subtitle-tv">В мастерскую</span>
</button>
<!-- Center Calm Narration Pill -->
<div class="flex items-center space-x-space-sm px-space-xl py-space-sm rounded-full bg-surface-container/90 backdrop-blur-md shadow-lg border-0">
<span class="material-symbols-outlined text-primary text-[26px]" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
<span class="font-caption-tv text-caption-tv tracking-wider uppercase text-on-surface-variant">ГОЛОС ДРУГА • LUMI:</span>
<span class="font-body-tv text-body-tv text-on-surface font-semibold">«Вот какую чудесную сказку мы придумали вместе!»</span>
</div>
<!-- Right Mood Badge: Sleepy Lullaby Ambience -->
<div class="flex items-center space-x-space-xs px-space-lg py-space-sm rounded-full bg-surface-container-high/80 backdrop-blur-md shadow-sm text-on-surface-variant">
<span class="material-symbols-outlined text-secondary text-[24px]">bedtime</span>
<span class="font-body-tv text-body-tv text-secondary font-medium">Колыбельная тишина 🎵</span>
</div>
</header>
<!-- Bottom Story Memory Card (Bedtime Finale Centerpiece) -->
<footer class="w-full flex justify-center pb-2">
<div class="w-full max-w-4xl bg-surface-container-low/90 backdrop-blur-xl rounded-[32px] p-space-2xl shadow-[0_24px_64px_rgba(0,0,0,0.65)] flex flex-col items-center text-center">
<!-- Story Book Title and Warm Subtitle -->
<h1 class="font-display-tv text-display-tv text-on-surface tracking-tight mb-space-xs drop-shadow-md">
          Тайна зачарованного дуба
        </h1>
<p class="font-body-tv text-body-tv text-on-surface-variant max-w-2xl mb-space-xl">
          Добрая сказка на ночь, сочинённая вместе с Роби и Люми
        </p>
<!-- Pure Three Bedtime Actions (Clean TV Focus Architecture) -->
<div class="flex items-center justify-center space-x-space-lg w-full">
<!-- Primary: Active Cyan Focused Action -->
<button autofocus="" class="tv-action-btn flex items-center justify-center space-x-space-sm px-10 py-4 rounded-full bg-primary-container text-on-primary font-subtitle-tv text-subtitle-tv font-bold transition-all duration-300 transform scale-105 shadow-[0_0_36px_rgba(56,217,210,0.65)] focus:outline-none focus:scale-110 focus:shadow-[0_0_48px_rgba(56,217,210,0.85)]" id="btn-replay" tabindex="0">
<span class="material-symbols-outlined text-[30px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span>[ OK ] Посмотреть ещё раз</span>
</button>
<!-- Secondary: Family Album Story Archive -->
<button class="tv-action-btn flex items-center justify-center space-x-space-sm px-9 py-4 rounded-full bg-surface-container-highest/90 text-on-surface font-subtitle-tv text-subtitle-tv font-semibold hover:bg-surface-variant transition-all duration-200 focus:outline-none focus:bg-primary-container focus:text-on-primary focus:scale-105 focus:shadow-[0_0_32px_rgba(56,217,210,0.6)]" id="btn-save" tabindex="0">
<span class="material-symbols-outlined text-[26px] text-accent-coral" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span>В наши истории</span>
</button>
<!-- Tertiary: Fresh Creative Cycle -->
<button class="tv-action-btn flex items-center justify-center space-x-space-sm px-9 py-4 rounded-full bg-surface-container-highest/90 text-on-surface font-subtitle-tv text-subtitle-tv font-semibold hover:bg-surface-variant transition-all duration-200 focus:outline-none focus:bg-primary-container focus:text-on-primary focus:scale-105 focus:shadow-[0_0_32px_rgba(56,217,210,0.6)]" id="btn-new" tabindex="0">
<span class="material-symbols-outlined text-[26px] text-accent-amber">auto_awesome</span>
<span>Новая сказка ✨</span>
</button>
</div>
</div>
</footer>
</div>
</div>
<script>
  (function() {
    const focusableElements = [
      document.getElementById('btn-workshop'),
      document.getElementById('btn-replay'),
      document.getElementById('btn-save'),
      document.getElementById('btn-new')
    ];

    let currentFocusIndex = 1; // Default to 'btn-replay'

    function updateFocus(newIndex) {
      if (newIndex >= 0 && newIndex < focusableElements.length) {
        currentFocusIndex = newIndex;
        focusableElements[currentFocusIndex].focus();
        
        // Dynamic focus styling sync
        const isReplay = currentFocusIndex === 1;
        const replayBtn = document.getElementById('btn-replay');
        if (replayBtn) {
          if (!isReplay && document.activeElement !== replayBtn) {
            replayBtn.classList.remove('scale-105', 'shadow-[0_0_36px_rgba(56,217,210,0.65)]');
          } else if (isReplay) {
            replayBtn.classList.add('scale-105', 'shadow-[0_0_36px_rgba(56,217,210,0.65)]');
          }
        }
      }
    }

    window.addEventListener('keydown', function(e) {
      switch (e.key) {
        case 'ArrowRight':
          if (currentFocusIndex >= 1 && currentFocusIndex < 3) {
            updateFocus(currentFocusIndex + 1);
            e.preventDefault();
          }
          break;
        case 'ArrowLeft':
          if (currentFocusIndex > 1 && currentFocusIndex <= 3) {
            updateFocus(currentFocusIndex - 1);
            e.preventDefault();
          }
          break;
        case 'ArrowUp':
          if (currentFocusIndex >= 1) {
            updateFocus(0); // Top bar button
            e.preventDefault();
          }
          break;
        case 'ArrowDown':
          if (currentFocusIndex === 0) {
            updateFocus(1); // Back to replay button
            e.preventDefault();
          }
          break;
      }
    });

    // Ensure initial focus
    window.addEventListener('DOMContentLoaded', function() {
      const replay = document.getElementById('btn-replay');
      if (replay) replay.focus();
    });
  })();
</script></main></body></html>
