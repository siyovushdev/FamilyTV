          "focus-glow": "rgba(56, 217, 210, 0.85)",

          "gutter": "1.5rem",
          "space-md": "1rem",
          "space-lg": "1.5rem",

<!-- Immersive Full-Screen 16:9 3D Illustration Canvas -->
<div class="absolute inset-0 w-full h-full bg-surface-container-lowest">
<img alt="Three cartoon story heroes on illuminated wooden stage" class="w-full h-full object-cover object-center pointer-events-none" src="https://lh3.googleusercontent.com/aida/AEtjO1VN_hnQ88XzpSjl2oYEMJAZBCjiXp_sxex7r0YQcHZCU3BqZI5aXaskKzKyGg5Cy6mR_EC3otHEtwt3_ALjGZ2zueHcR3V2URd2x7auOsUNwIdBs4Hyc0594U2BI6en38wOdacNzdWYZnvSpJMxlW9Nc_FGNOkLFOzzTXIavv7yITwd9olfiAGke41Dqn1sgmaAuwLPLtMcPw8mvO4C_kIZqBeE3rO0NEW7w507F4G7BT4UsNnRUQgmnQ"/>
<!-- Ambient Depth Scrims -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/95 via-transparent to-surface-container-lowest/80 pointer-events-none"></div>
<div class="absolute inset-0 bg-radial-gradient from-transparent via-surface-container-lowest/20 to-surface-container-lowest/90 pointer-events-none"></div>
</div>
<!-- TV Safe Viewport Container -->
<div class="relative z-10 w-full h-full flex flex-col justify-between px-margin-safe-x py-margin-safe-y">
<!-- Top Header Bar -->
<header class="flex items-center justify-between w-full h-16">
<!-- Back Navigation Pill -->
<button class="flex items-center gap-space-sm bg-surface-container-high/80 hover:bg-surface-container-highest backdrop-blur-md px-6 py-3 rounded-full text-on-surface transition-all duration-300 shadow-lg cursor-pointer" id="btn-back" tabindex="1">
<span class="material-symbols-outlined text-primary text-subtitle-tv">arrow_back</span>
<span class="font-subtitle-tv text-subtitle-tv">Назад</span>
</button>
<!-- Lumi Companion Guide Bubble -->
<div class="flex items-center gap-4 bg-surface-container/90 border border-primary/30 backdrop-blur-xl px-7 py-3 rounded-full shadow-2xl">
<div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-title-tv animate-pulse">auto_awesome</span>
</div>
<div class="flex flex-col">
<span class="font-title-tv text-subtitle-tv text-on-surface tracking-wide">
<span class="text-primary font-bold">Lumi:</span> «Кто отправится в путешествие?»
          </span>
</div>
</div>
<!-- Balance Spacer (Maintains Symmetry) -->
<div class="w-36 h-12 flex items-center justify-end">
<div class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-high/60 backdrop-blur-sm">
<span class="w-2.5 h-2.5 rounded-full bg-primary animate-ping"></span>
<span class="font-caption-tv text-caption-tv text-on-surface-variant">Шаг 2 из 4</span>
</div>
</div>
</header>
<!-- Interactive Character Selection Zone -->
<main class="grid grid-cols-3 gap-gutter items-end w-full h-[680px] pb-6">
<!-- Character 1: Left Kid Explorer (Tim) - Unfocused State -->
<div class="group relative flex flex-col items-center justify-end h-full cursor-pointer transition-transform duration-300" id="hero-tim" tabindex="2">
<!-- Unfocused Nameplate Pill -->
<div class="mb-4 bg-surface-container-lowest/80 backdrop-blur-md px-6 py-2.5 rounded-full text-on-surface-variant/90 font-title-tv text-subtitle-tv shadow-xl transition-all duration-300 group-hover:text-on-surface">
          Тим • Исследователь
        </div>
</div>
<!-- Character 2: Center Robot (ROBI) - ACTIVE FOCUSED STATE -->
<div class="relative flex flex-col items-center justify-end h-full cursor-pointer" id="hero-robi" tabindex="3">
<!-- Dynamic Glowing TV Focus Halo & Frame Surrounding Robi -->
<div class="absolute inset-x-2 top-4 bottom-24 border-4 border-focus-border rounded-3xl shadow-[0_0_50px_rgba(56,217,210,0.65)] bg-primary/5 backdrop-blur-[2px] transition-all duration-300 pointer-events-none flex flex-col justify-between p-4">
<!-- Top Corner Micro-Badges -->
<div class="flex justify-between items-center w-full">
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-lowest/80 text-primary font-caption-tv text-caption-tv">
<span class="material-symbols-outlined text-caption-tv">star</span>
<span>Любимец зрителей</span>
</div>
<div class="w-3 h-3 rounded-full bg-primary animate-ping"></div>
</div>
</div>
<!-- Robi Hero Identity Badge -->
<div class="relative z-20 mb-3 bg-[#162040]/95 text-on-surface px-7 py-2.5 rounded-full font-title-tv text-subtitle-tv border border-primary/40 shadow-2xl flex items-center gap-2">
<span class="w-2.5 h-2.5 rounded-full bg-primary animate-pulse"></span>
<span>Роби • Любопытный робот</span>
</div>
<!-- Main Confirmation Action Button -->
<button class="relative z-20 bg-primary hover:bg-primary-fixed-dim text-surface-container-lowest font-display-tv text-subtitle-tv font-bold py-3.5 px-10 rounded-full shadow-[0_12px_36px_rgba(56,217,210,0.5)] transition-all duration-200 transform scale-105 active:scale-95 flex items-center gap-3" id="btn-confirm-hero">
<span class="bg-surface-container-lowest text-primary text-caption-tv font-extrabold px-2.5 py-1 rounded-md tracking-wider">OK</span>
<span>Выбрать героя ✨</span>
</button>
</div>
<!-- Character 3: Right Woodland Creature (Pushistik) - Unfocused State -->
<div class="group relative flex flex-col items-center justify-end h-full cursor-pointer transition-transform duration-300" id="hero-pushistik" tabindex="4">
<!-- Unfocused Nameplate Pill -->
<div class="mb-4 bg-surface-container-lowest/80 backdrop-blur-md px-6 py-2.5 rounded-full text-on-surface-variant/90 font-title-tv text-subtitle-tv shadow-xl transition-all duration-300 group-hover:text-on-surface">
          Пушистик • Лесной зверёк
        </div>
</div>
</main>
<!-- Subdued Context Cue Hint -->
<div class="flex justify-center items-center w-full pb-2">
<div class="flex items-center gap-6 text-on-surface-variant/70 font-caption-tv text-caption-tv">
<span class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-caption-tv">arrow_back</span>
<span class="material-symbols-outlined text-caption-tv">arrow_forward</span>
          Выбрать другого
        </span>
<span class="w-1.5 h-1.5 rounded-full bg-on-surface-variant/40"></span>
<span class="flex items-center gap-1.5">
<span class="px-2 py-0.5 rounded bg-surface-container-high text-on-surface">OK</span>
          Продолжить
        </span>
</div>
</div>
</div>
</div></main></body></html>
