          "gutter": "1.5rem",

        },

          ],

          ]
        },
        "fontSize": {

            {

            }
          ],
          "body-tv": [

      },
    },
  }</script></head><body class="bg-surface font-body-tv text-on-surface w-[1920px] h-[1080px] overflow-hidden select-none"><main class="relative w-full h-full overflow-hidden"><div class="flex flex-col w-full h-[1080px] relative overflow-hidden select-none">
<!-- Immersive Full-Bleed Living Room 16:9 Canvas -->
<div class="absolute inset-0 w-full h-full bg-surface-container-lowest">
<!-- Cinematic Visual Payoff Stage -->
<img alt="Дверь волшебного дерева открылась" class="w-full h-full object-cover object-center scale-[1.02] transform transition-transform duration-1000 ease-out" src="https://lh3.googleusercontent.com/aida/AEtjO1VIpyB5DCh7Vg5FQwzFJKK-bIx6E3cdyvKo1eQYxmH4lgQow0ObrPAz3GHH7MAi9qZzfWNIf2zZIVub99MP7hjYoOnWXDRL4qSUksA6_zuj3WMU9fovcG7wMOMiXasNw1_qx5Mr43k2BuSRFmTdqHtKf38varn3zU0LdoilTl4Ikrs4pr8sAnBCYFvYqJZbp7lkb9O8aIUFw4f_8mH7bRgGqM3R3zrCbqTJB3105aOZtJVkSPcP1-R6Ilo"/>
<!-- Atmospheric Ambient Vignettes & Depth Gradients -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest/40 to-surface-container-lowest/80 pointer-events-none"></div>
<div class="absolute inset-0 bg-gradient-to-b from-surface-container-lowest/90 via-transparent to-surface-container-lowest/95 pointer-events-none"></div>
<div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[900px] h-[340px] bg-primary/10 rounded-full blur-[140px] pointer-events-none"></div>
<div class="absolute -bottom-24 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-primary/20 rounded-full blur-[120px] pointer-events-none"></div>
</div>
<!-- Safe Margin Over-Screen Container (88px X, 72px Y) -->
<div class="relative z-10 flex flex-col justify-between w-full h-full px-margin-safe-x py-margin-safe-y">
<!-- Top Bar: Navigation & Narrative Sparkle Speech Pill -->
<header class="flex items-center justify-between w-full">
<!-- Back Pill (Resting TV State) -->
<button class="group flex items-center gap-space-xs px-space-xl py-space-sm bg-surface-container-high/80 hover:bg-surface-variant backdrop-blur-md rounded-full shadow-lg transition-all duration-300 transform hover:scale-105 focus:scale-105 focus:outline-none focus:bg-surface-variant focus:shadow-[0_0_0_4px_#38d9d2,0_12px_28px_rgba(56,217,210,0.35)]" id="btn-back" tabindex="2">
<span class="material-symbols-outlined text-primary text-title-tv transition-transform group-hover:-translate-x-1">arrow_back</span>
<span class="font-subtitle-tv text-subtitle-tv text-on-surface tracking-wide">Назад</span>
</button>
<!-- Lumi Speech Badge (Magic Consequence Payoff) -->
<div class="flex items-center gap-space-md px-space-xl py-space-sm bg-surface-container/90 border-0 backdrop-blur-xl rounded-full shadow-2xl">
<div class="relative flex items-center justify-center w-11 h-11 rounded-full bg-gradient-to-tr from-primary to-accent-amber shadow-[0_0_20px_rgba(56,217,210,0.5)]">
<span class="material-symbols-outlined text-surface-container-lowest text-[26px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-accent-amber rounded-full animate-ping"></span>
</div>
<div class="flex items-baseline gap-space-xs">
<span class="font-title-tv text-caption-tv text-primary tracking-wider uppercase">ЛЮМИ • Волшебный момент:</span>
<span class="font-subtitle-tv text-body-tv text-on-surface font-semibold">«Ух ты! Дверь открылась, а там тайная комната!»</span>
</div>
</div>
<!-- Balance Anchor / Chapter Pill -->
<div class="flex items-center gap-space-xs px-space-lg py-space-sm bg-surface-container-high/60 backdrop-blur-md rounded-full">
<span class="material-symbols-outlined text-accent-amber text-body-tv" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-caption-tv text-caption-tv text-on-surface-variant tracking-wider uppercase">Глава 1: Ключ открытий</span>
</div>
</header>
<!-- Center Stage: Pure Visual Resonance Indicator -->
<div class="flex flex-col items-center justify-center pointer-events-none">
<div class="relative flex flex-col items-center text-center">
<!-- Floating Celestial Sparkle Crest -->
<div class="inline-flex items-center justify-center p-3 mb-space-sm rounded-full bg-primary/10 backdrop-blur-md shadow-[0_0_40px_rgba(56,217,210,0.35)]">
<span class="material-symbols-outlined text-primary text-display-tv animate-pulse" style="font-variation-settings: 'FILL' 1;">lock_open_right</span>
</div>
<h1 class="font-display-tv text-display-tv font-bold text-on-surface tracking-tight drop-shadow-[0_8px_24px_rgba(0,0,0,0.8)]">
          Мир изменился!
        </h1>
<p class="font-subtitle-tv text-subtitle-tv text-secondary mt-1 tracking-wide drop-shadow-[0_4px_12px_rgba(0,0,0,0.85)] max-w-2xl">
          Смелый выбор Роби озарил древнее дерево теплым золотым светом
        </p>
</div>
</div>
<!-- Bottom Action Pod: Dominant TV Remote Primary Target -->
<div class="flex flex-col items-center justify-end w-full pb-2">
<!-- Glow Underlay Emitter -->
<div class="relative group">
<div class="absolute -inset-1.5 bg-gradient-to-r from-primary via-primary-fixed to-primary rounded-full blur-xl opacity-80 group-hover:opacity-100 animate-pulse transition duration-500"></div>
<!-- Primary Action Button with TV 10-foot Focus Attributes -->
<button autofocus="" class="relative flex items-center justify-center gap-space-md bg-primary hover:bg-primary-fixed text-on-primary-fixed font-title-tv text-subtitle-tv font-bold py- space-sm px-space-2xl rounded-full shadow-[0_0_36px_rgba(56,217,210,0.7)] transition-all duration-300 transform scale-105 hover:scale-110 focus:scale-110 focus:outline-none focus:shadow-[0_0_0_5px_#5ff6ee,0_0_50px_rgba(95,246,238,0.9)]" id="btn-confirm" tabindex="1">
<!-- Remote Button Graphic Hint -->
<span class="flex items-center justify-center px-2.5 py-0.5 rounded-md bg-on-primary-fixed/15 text-on-primary-fixed font-title-tv text-caption-tv uppercase tracking-widest font-extrabold">
            OK
          </span>
<span class="tracking-wide">Заглянуть внутрь</span>
<span class="material-symbols-outlined text-title-tv font-bold transition-transform duration-300 group-hover:translate-x-1.5">
            arrow_forward
          </span>
</button>
</div>
<!-- TV Remote Guidance Label -->
<p class="font-caption-tv text-caption-tv text-on-surface-variant/80 mt-space-md tracking-wider flex items-center gap-1.5 drop-shadow-md">
<span class="material-symbols-outlined text-body-tv text-primary" style="font-variation-settings: 'FILL' 1;">gamepad</span>
        Нажмите центральную кнопку пульта для перехода
      </p>
</div>
</div>
</div>
<script>
  (function() {
    const confirmBtn = document.getElementById('btn-confirm');
    const backBtn = document.getElementById('btn-back');

    if (confirmBtn) {
      // Ensure initial 10-foot TV active focus
      confirmBtn.focus();

      confirmBtn.addEventListener('click', () => {
        confirmBtn.classList.add('scale-95');
        setTimeout(() => {
          confirmBtn.classList.remove('scale-95');
        }, 150);
      });
    }

    // Android TV D-Pad directional navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        backBtn?.focus();
      } else if (e.key === 'ArrowDown') {
        confirmBtn?.focus();
      } else if (e.key === 'Backspace' || e.key === 'Escape') {
        backBtn?.click();
      }
    });
  })();
</script></main></body></html>
