<svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">
<circle class="stroke-surface-variant fill-none" cx="60" cy="60" r="50" stroke-width="8"></circle>
<circle class="stroke-primary fill-none transition-all duration-1000 ease-linear" cx="60" cy="60" id="timerCircle" r="50" stroke-dasharray="314.159" stroke-dashoffset="62.83" stroke-linecap="round" stroke-width="8" style="stroke-dashoffset: 314.159;"></circle>
</svg>
<div class="absolute flex flex-col items-center justify-center">
<span class="font-display-tv text-display-tv font-extrabold text-primary leading-none" id="countdownVal">❄️</span>
<span class="font-caption-tv text-caption-tv text-on-surface-variant mt-1">сек</span>
</div>
</div>
<span class="mt-4 px-4 py-1.5 rounded-full bg-surface-variant/80 text-on-surface font-caption-tv text-caption-tv">Замри как льдинка</span>
</div>
<div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-6 px-8 py-3.5 rounded-2xl bg-slate-900/75 border border-cyan-500/30 backdrop-blur-md text-cyan-100 text-lg shadow-xl z-20"><div class="flex items-center gap-3"><span class="text-2xl">✨</span><span class="font-subtitle-tv text-subtitle-tv font-semibold text-cyan-100">Тсс... Застыли на месте вместе с Луми!</span></div><div class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-primary/10 border border-cyan-400/30 text-cyan-300 font-caption-tv text-caption-tv"><span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span><span class="">Музыка возобновится через секунду...</span></div></div>

</div>
<script>
    (function() {
      let seconds = 5;
      const countEl = document.getElementById('countdownVal');
      const circleEl = document.getElementById('timerCircle');
      const totalOffset = 314.159;
      
      const interval = setInterval(() => {
        seconds--;
        if (seconds >= 0) {
          countEl.textContent = seconds < 10 ? '0' + seconds : seconds;
          const offset = totalOffset - (totalOffset * (seconds / 5));
          circleEl.style.strokeDashoffset = offset;
        } else {
          clearInterval(interval);
          countEl.textContent = '❄️';
          const nextBtn = document.getElementById('nextBtn');
          if (nextBtn) {
            nextBtn.focus();
          }
        }
      }, 1000);

      const nextBtn = document.getElementById('nextBtn');
      const pauseBtn = document.getElementById('pauseBtn');

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          if (document.activeElement === pauseBtn) {
            alert('Игра на паузе!');
          } else if (document.activeElement === nextBtn || !document.activeElement || document.activeElement === document.body) {
            alert('Переход к Шагу 4: Финальный танец!');
          }
        }
      });
      
      if (nextBtn) {
        nextBtn.focus();
      }
    })();
  </script>
