<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/85 via-transparent to-surface-container-lowest/60 pointer-events-none"></div>
<div class="absolute inset-0 bg-radial-gradient from-transparent via-background/20 to-surface-container-lowest/70 pointer-events-none"></div>

<div class="absolute inset-0 px-margin-safe-x py-margin-safe-y flex flex-col justify-between pointer-events-none">

<span class="font-caption-tv text-caption-tv text-on-surface-variant group-focus:text-on-primary opacity-80">[ || ]</span>
</button>

</div>
</div>
</div>
<script>
  (function () {
    // 10-foot UI remote D-Pad navigation loop
    const pauseBtn = document.getElementById('btn-pause');
    const nextBtn = document.getElementById('btn-next');

    // Default focused element for living room TV
    if (nextBtn) {
      nextBtn.focus();
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        if (document.activeElement === nextBtn) {
          pauseBtn.focus();
        }
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        if (document.activeElement === pauseBtn) {
          nextBtn.focus();
        }
      } else if (e.key === 'Enter' || e.key === ' ') {
        document.activeElement.click();
      }
    });
  })();
</script></main>
