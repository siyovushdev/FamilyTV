<script>
  (function() {
    const focusableSelectors = 'button, [tabindex="1"], [tabindex="2"], [tabindex="3"], [tabindex="4"]';
    const focusableElements = Array.from(document.querySelectorAll(focusableSelectors));
    
    const replayBtn = document.getElementById('action-replay');
    if (replayBtn) {
      replayBtn.focus();
    }

    document.addEventListener('keydown', function(e) {
      const active = document.activeElement;
      const currentIndex = focusableElements.indexOf(active);

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        const next = (currentIndex + 1) % focusableElements.length;
        focusableElements[next]?.focus();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        const prev = (currentIndex - 1 + focusableElements.length) % focusableElements.length;
        focusableElements[prev]?.focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const backBtn = document.getElementById('btn-back');
        backBtn?.focus();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        replayBtn?.focus();
      }
    });
  })();
</script></main>
