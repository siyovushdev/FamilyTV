<path class="text-primary transition-all duration-1000 ease-linear" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" id="timer-arc" stroke="currentColor" stroke-dasharray="0, 100" stroke-linecap="round" stroke-width="3"></path>
</svg>
<span class="absolute font-title-tv text-subtitle-tv font-bold text-primary" id="timer-sec">0</span>

<div class="absolute bottom-12 left-1/2 -translate-x-1/2 w-[720px] flex flex-col items-center gap-2.5 px-8 py-3 rounded-2xl bg-surface-container-low/85 backdrop-blur-md text-on-surface shadow-2xl z-20"><div class="flex items-center justify-between w-full font-caption-tv text-caption-tv text-on-surface-variant"><span class="flex items-center gap-1.5 text-primary font-semibold"><span class="">⭐</span> Старт мостика</span><span class="text-accent-amber font-semibold flex items-center gap-1.5">Звёздная поляна <span class="">✨</span></span></div><div class="relative w-full h-3 bg-surface-container rounded-full overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-secondary via-primary to-accent-amber shadow-[0_0_15px_#38d9d2] transition-all duration-1000 ease-linear" style="width: 78%;"></div></div></div>

</div>
</div>
<script>
  (function() {
    let timeLeft = 30;
    const maxTime = 30;
    const timerText = document.getElementById('timer-sec');
    const timerArc = document.getElementById('timer-arc');

    const countdown = setInterval(function() {
      if (timeLeft > 0) {
        timeLeft--;
        if (timerText) timerText.textContent = timeLeft;
        if (timerArc) {
          const percentage = (timeLeft / maxTime) * 100;
          timerArc.setAttribute('stroke-dasharray', percentage + ', 100');
        }
      } else {
        clearInterval(countdown);
        const completeBtn = document.getElementById('btn-complete');
        if (completeBtn) completeBtn.focus();
      }
    }, 1000);

    const pauseBtn = document.getElementById('btn-pause');
    const completeBtn = document.getElementById('btn-complete');

    window.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        if (document.activeElement === pauseBtn) completeBtn?.focus();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        if (document.activeElement === completeBtn) pauseBtn?.focus();
      }
    });
  })();
</script></main>
