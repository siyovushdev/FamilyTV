</div>
<script>
    document.addEventListener('keydown', (e) => {
      const focusable = Array.from(document.querySelectorAll('button[tabindex]'));
      const activeIdx = focusable.indexOf(document.activeElement);

      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        const next = activeIdx > 0 ? focusable[activeIdx - 1] : focusable[focusable.length - 1];
        next.focus();
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        const next = activeIdx < focusable.length - 1 ? focusable[activeIdx + 1] : focusable[0];
        next.focus();
      } else if (e.key === 'Enter' || e.key === ' ') {
        if (document.activeElement) {
          document.activeElement.classList.add('scale-95');
          setTimeout(() => {
            document.activeElement.classList.remove('scale-95');
          }, 150);
        }
      }
    });
  </script>
