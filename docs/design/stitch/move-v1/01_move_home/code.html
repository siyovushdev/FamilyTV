<script>
  // Living Room Android TV Remote Keyboard / D-Pad Handler
  document.addEventListener('DOMContentLoaded', () => {
    const heroCard = document.getElementById('hero-portal-card');
    const startBtn = document.getElementById('btn-start');
    const backBtn = document.getElementById('btn-back');

    if (heroCard) {
      heroCard.focus();
    }

    const interactiveElements = [backBtn, heroCard, startBtn];
    let currentIndex = 1;

    document.addEventListener('keydown', (e) => {
      // Enter or Space -> Trigger Action
      if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13) {
        e.preventDefault();
        const active = document.activeElement;
        if (active === heroCard || active === startBtn) {
          startBtn.style.transform = 'scale(0.95)';
          setTimeout(() => {
            startBtn.style.transform = 'scale(1.05)';
            alert('🚀 Запуск приключения «Разбудим звёзды»! Приготовьтесь к веселой разминке!');
          }, 150);
        } else if (active === backBtn) {
          window.history.back();
        }
      }

      // Up arrow
      if (e.key === 'ArrowUp' || e.keyCode === 38) {
        if (currentIndex > 0) {
          currentIndex = 0;
          backBtn.focus();
        }
      }

      // Down arrow
      if (e.key === 'ArrowDown' || e.keyCode === 40) {
        if (currentIndex === 0) {
          currentIndex = 1;
          heroCard.focus();
        }
      }
    });

    startBtn.addEventListener('click', () => {
      alert('🚀 Запуск приключения «Разбудим звёзды»! Приготовьтесь к веселой разминке!');
    });
  });
