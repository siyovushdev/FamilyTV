<!DOCTYPE html><html lang="ru" style=""><head>
  <meta charset="UTF-8">
  <title>FamilyTV — 4. Experiment Running (Идёт опыт)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #080d1e;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tv-stage {
      width: 1920px;
      height: 1080px;
      position: relative;
      background: #080d1e;
      overflow: hidden;
      box-sizing: border-box;
    }
    .glow-cyan {
      box-shadow: 0 0 45px rgba(56, 217, 210, 0.6);
    }
  </style>
</head>
<body style="width: 1920px; height: 1080px; max-width: 1920px; max-height: 1080px; overflow: hidden; margin: 0px auto; position: relative; background: rgb(8, 13, 30); display: flex; align-items: center; justify-content: center;">
  <div class="tv-stage flex flex-col justify-between p-[56px] relative select-none" style="width: 1920px; height: 1080px; max-width: 1920px; max-height: 1080px; overflow: hidden; margin: 0px auto; position: relative; background: rgb(8, 13, 30);">
    <!-- Lab Comparison Illustration -->
    <div class="absolute inset-0 z-0">
      <img src="https://lh3.googleusercontent.com/aida/AEtjO1Wv6s_J_Bbvy-w1Eeu5vGpD-SShO1-EaHaReu51-WqiiKB1OgWopZTXJVDlaHRYJmGzkiqK3WtvNDMrPNdkGZ-O-J5e6Gr5y_TKhOnZiZ0ic2WeXjlvG1mF--EgmQVKeczAKrgtBmVDk8b8JLsENY9onT55pShKkeemaymAA246hfuPCLaiSKZthj20OPbhbLjqpa7fSj3_RQ7rTadh38nN17mj25rFTtw3M3ilDOGkK8B1jTSiPYx7psM" alt="Experiment Running" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-[#080d1e]/85 via-transparent to-[#080d1e]/70 pointer-events-none"></div>
    </div>

    <!-- Top Bar -->
    <div class="relative z-10 flex items-center justify-between w-full">
      <div class="flex items-center gap-3 bg-[#0d152bb3] backdrop-blur-md px-6 py-3.5 rounded-full border border-white/10 text-white/90 text-xl font-bold">
        <span class="text-2xl text-[#38d9d2]">‹</span> Назад
      </div>

      <!-- Lumi Live Observation -->
      <div class="flex items-center gap-4 bg-[#0d152bfa] backdrop-blur-lg px-8 py-3.5 rounded-full border border-[#38d9d2]/40 shadow-[0_0_30px_rgba(56,217,210,0.25)]">
        <div class="w-10 h-10 rounded-full bg-[#38d9d2]/20 flex items-center justify-center text-2xl animate-spin" style="animation-duration: 6s;">🤖</div>
        <span class="text-white text-2xl font-bold tracking-wide">Луми: «Смотри внимательно! Время побежало...»</span>
      </div>

      <div class="flex items-center gap-3 bg-[#0d152bb3] backdrop-blur-md px-6 py-3.5 rounded-full border border-[#ffd166]/40 text-[#ffd166] text-xl font-bold">
        <span class="animate-pulse">⏳</span> Идёт опыт...
      </div>
    </div>

    <!-- In-Scene Labels (Subtle cause-and-effect indicators directly on the 2 physical scenes) -->
    <div class="relative z-10 flex justify-between items-center px-16 pointer-events-none">
      <!-- Sun side status -->
      <div class="bg-[#121b36e6] backdrop-blur-md border border-[#ffd166]/40 px-6 py-3 rounded-2xl text-left shadow-xl">
        <div class="text-[#ffd166] font-bold text-xl flex items-center gap-2">☀️ Солнце греет</div>
        <div class="text-white text-2xl font-black">Тает в лужицу! 💧</div>
      </div>

      <!-- Shade side status -->
      <div class="bg-[#121b36e6] backdrop-blur-md border border-[#38d9d2]/40 px-6 py-3 rounded-2xl text-right shadow-xl">
        <div class="text-[#38d9d2] font-bold text-xl flex items-center justify-end gap-2">Прохлада 🌲</div>
        <div class="text-white text-2xl font-black">Крепкий кубик ❄️</div>
      </div>
    </div>

    <!-- Bottom Action (Only timelapse speed-up action) -->
    <div class="relative z-10 flex justify-center pb-4">
      <div class="bg-[#38d9d2] text-[#080d1e] text-3xl font-black py-4 px-14 rounded-full flex items-center gap-4 glow-cyan scale-105 cursor-pointer">
        <span class="bg-[#080d1e] text-[#38d9d2] px-3.5 py-1 rounded-xl text-xl font-extrabold">OK</span>
        <span class="">Ускорить время ⏩</span>
      </div>
    </div>
  </div>



</body></html>
