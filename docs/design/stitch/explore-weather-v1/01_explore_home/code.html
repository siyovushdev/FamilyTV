<!DOCTYPE html><html lang="ru" style=""><head>
  <meta charset="UTF-8">
  <title>FamilyTV — 1. Explore Home (Мир открытий)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #080d1e;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tv-stage {
      width: 1920px;
      height: 1080px;
      position: relative;
      background: #080d1e;
      overflow: hidden;
      box-sizing: border-box;
    }
    .glow-cyan {
      box-shadow: 0 0 45px rgba(56, 217, 210, 0.55), 0 0 90px rgba(56, 217, 210, 0.25);
    }
  </style>
</head>
<body style="width: 1920px; height: 1080px; max-width: 1920px; max-height: 1080px; overflow: hidden; margin: 0px auto; position: relative; background: rgb(8, 13, 30);">
  <div class="tv-stage flex flex-col justify-between p-[56px] relative select-none" style="width: 1920px; height: 1080px; max-width: 1920px; max-height: 1080px; overflow: hidden; position: relative; background: rgb(8, 13, 30);">
    <!-- Background Illustrated World -->
    <div class="absolute inset-0 z-0">
      <img src="https://lh3.googleusercontent.com/aida/AEtjO1XXs52xrkGAxMPYBqFM2qpTode683B1zOMPrcSrFeGDdI0B89RDDBNJACkqLxchzf6tgAzlVHNcMhxnVyVs96G--wJhvmuXLJnr2bYLFQovaB2rmWYOa5w1fLjD1rtndNgZf7q9sDxOICsCay_J2jUIMsggV8DmBwXlyU5asntpG_SdjyLjAXKAuL7b2VTelXworVx4RzJ3GN48zx22IV2A0a6_jiPxLS7ZFvaU5It9Yph3t_DxwbNvzcA" alt="Explore World" class="w-full h-full object-cover">
      <!-- Vignette for TV depth -->
      <div class="absolute inset-0 bg-gradient-to-t from-[#080d1e]/90 via-transparent to-[#080d1e]/75 pointer-events-none"></div>
    </div>

    <!-- Top Bar -->
    <div class="relative z-10 flex items-center justify-between w-full">
      <div class="flex items-center gap-4 bg-[#0d152bb3] backdrop-blur-md px-6 py-3.5 rounded-full border border-white/10 text-white/90 text-xl font-bold">
        <span class="text-2xl text-[#38d9d2]">‹</span> На главную
      </div>
      
      <!-- Lumi Speech Bubble -->
      <div class="flex items-center gap-4 bg-[#0d152bde] backdrop-blur-lg px-8 py-3.5 rounded-full border border-[#38d9d2]/40 shadow-[0_0_30px_rgba(56,217,210,0.2)]">
        <div class="w-10 h-10 rounded-full bg-[#38d9d2]/20 flex items-center justify-center text-2xl animate-pulse">🤖</div>
        <span class="text-white text-2xl font-bold tracking-wide">Луми: «Куда отправимся исследовать?»</span>
      </div>

      
    </div>

    <!-- World Locations Layer (World-First Navigation) -->
    <div class="absolute inset-0 z-10 pointer-events-none">
  <!-- 1. Космос (over treehouse observatory on left) -->
  <div class="absolute left-[90px] top-[260px] flex flex-col items-center pointer-events-auto group transition-transform duration-300 hover:scale-105">
    <div class="bg-[#0b1224cc] backdrop-blur-md border border-white/15 px-6 py-3 rounded-2xl text-center shadow-lg">
      <div class="text-3xl mb-1">🔭</div>
      <div class="text-white text-xl font-bold">Космос</div>
      <div class="text-white/60 text-sm">Обсерватория</div>
    </div>
  </div>

  <!-- 2. Лес (over nature mushroom grove) -->
  <div class="absolute left-[240px] top-[480px] flex flex-col items-center pointer-events-auto group transition-transform duration-300 hover:scale-105">
    <div class="bg-[#0b1224cc] backdrop-blur-md border border-white/15 px-6 py-3 rounded-2xl text-center shadow-lg">
      <div class="text-3xl mb-1">🌲</div>
      <div class="text-white text-xl font-bold">Лес</div>
      <div class="text-white/60 text-sm">Тайная поляна</div>
    </div>
  </div>

  <!-- 3. Погода (FOCUSED ACTIVE with cyan glow and [OK] Исследовать over central laboratory table) -->
  <div class="absolute left-[540px] top-[450px] -translate-x-1/2 flex flex-col items-center pointer-events-auto transition-transform duration-300 scale-105">
    <div class="flex items-center gap-2 bg-[#38d9d2] text-[#080d1e] font-extrabold text-sm px-4 py-1.5 rounded-full mb-2 shadow-lg">
      <span class="">● ВЫБРАНО ПУЛЬТОМ</span>
    </div>
    <div class="w-80 bg-[#0e1935fa] border-4 border-[#38d9d2] glow-cyan rounded-3xl p-5 text-center shadow-2xl backdrop-blur-xl">
      <div class="text-4xl mb-1">☀️ ❄️</div>
      <div class="text-[#38d9d2] text-2xl font-extrabold tracking-wide mb-1">Погода</div>
      <div class="text-white/80 text-sm font-medium mb-3">Таяние льда и облака</div>
      <div class="bg-[#38d9d2] text-[#080d1e] text-xl font-black py-3 px-6 rounded-2xl flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(56,217,210,0.6)]">
        <span class="">[ OK ]</span>
        <span class="">Исследовать</span>
      </div>
    </div>
  </div>

  <!-- 4. Как устроено (over mechanical gear machine workbench on right) -->
  <div class="absolute right-[330px] top-[490px] flex flex-col items-center pointer-events-auto group transition-transform duration-300 hover:scale-105">
    <div class="bg-[#0b1224cc] backdrop-blur-md border border-white/15 px-6 py-3 rounded-2xl text-center shadow-lg">
      <div class="text-3xl mb-1">⚙️</div>
      <div class="text-white text-xl font-bold">Как устроено</div>
      <div class="text-white/60 text-sm">Мастерская</div>
    </div>
  </div>

  <!-- 5. Опыты (over rocket launchpad area far right) -->
  <div class="absolute right-[80px] top-[390px] flex flex-col items-center pointer-events-auto group transition-transform duration-300 hover:scale-105">
    <div class="bg-[#0b1224cc] backdrop-blur-md border border-white/15 px-6 py-3 rounded-2xl text-center shadow-lg">
      <div class="text-3xl mb-1">🧪</div>
      <div class="text-white text-xl font-bold">Опыты</div>
      <div class="text-white/60 text-sm">Лаборатория</div>
    </div>
  </div>
</div>
  </div>



</body></html>
