<!DOCTYPE html><html lang="ru" style=""><head>
  <meta charset="UTF-8">
  <title>FamilyTV — 3. Prediction State (Солнце или Тень)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #080d1e;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tv-stage {
      width: 1920px;
      height: 1080px;
      position: relative;
      background: #080d1e;
      overflow: hidden;
      box-sizing: border-box;
    }
    .glow-cyan {
      box-shadow: 0 0 50px rgba(56, 217, 210, 0.7), 0 0 100px rgba(56, 217, 210, 0.35);
    }
  </style>
</head>
<body style="width: 1920px; height: 1080px; max-width: 1920px; max-height: 1080px; overflow: hidden; margin: 0px auto; position: relative; background: rgb(8, 13, 30);">
  <div class="tv-stage flex flex-col justify-between p-[56px] relative select-none" style="width: 1920px; height: 1080px; max-width: 1920px; max-height: 1080px; overflow: hidden; margin: 0px auto; position: relative; background: rgb(8, 13, 30);">
    <!-- Lab Background -->
    <div class="absolute inset-0 z-0">
      <img src="https://lh3.googleusercontent.com/aida/AEtjO1XjwFBvbPLoUQPIC5DqtXjTP_LCr_RQAMrCwq-yTMKm91GY46dqsUM4mH2Lix5H_WavqlTxlZf31YZD_UoR6AYLvmhaiRx9y4tnFuFUXK0uHQh5gCJHdTUXNCQQyf_xMIdIc9FFdHI1Ink7T67tzHTg7_uG2ak_eZ3n4fbRehdpebrmHB8KhLJ7BVpkEW3Hr8BmWIEjhDeoFaOycnQXt2T9FR8WEYd6n9ksY68Heyuy7a3jT_rVAMu4NQ" alt="Prediction State" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-[#080d1e]/85 via-transparent to-[#080d1e]/70 pointer-events-none"></div>
    </div>

    <!-- Top Bar -->
    <div class="relative z-10 flex items-center justify-between w-full">
      <div class="flex items-center gap-3 bg-[#0d152bb3] backdrop-blur-md px-6 py-3.5 rounded-full border border-white/10 text-white/90 text-xl font-bold">
        <span class="text-2xl text-[#38d9d2]">‹</span> Назад
      </div>

      <!-- Lumi Prediction Prompt -->
      <div class="flex items-center gap-4 bg-[#0d152bfa] backdrop-blur-lg px-8 py-3.5 rounded-full border border-[#38d9d2]/40 shadow-[0_0_30px_rgba(56,217,210,0.25)]">
        <div class="w-10 h-10 rounded-full bg-[#38d9d2]/20 flex items-center justify-center text-2xl">🤖</div>
        <span class="text-white text-2xl font-bold tracking-wide">Луми: «Куда положим первый кубик льда?»</span>
      </div>

      <div class="flex items-center gap-2 bg-[#0d152bb3] backdrop-blur-md px-5 py-3.5 rounded-full border border-white/10 text-white/70 text-xl font-bold">
        <span class="">Проверяем догадку ✨</span>
      </div>
    </div>

    <!-- Physical Location Focus Targets (LEFT: Sun Plate in active focus, RIGHT: Shade Plate) -->
    <div class="absolute inset-0 z-10 pointer-events-none"><div class="absolute left-[340px] top-[550px] w-[270px] h-[100px] rounded-full border-4 border-[#38d9d2] glow-cyan shadow-[0_0_50px_rgba(56,217,210,0.8)] pointer-events-auto flex items-center justify-center"><div class="bg-[#38d9d2] text-[#080d1e] font-black text-xl px-5 py-2 rounded-full shadow-lg -translate-y-16 flex items-center gap-2"><span class="">☀️</span><span class="">[ OK ] Сюда на солнышко!</span></div></div><div class="absolute right-[460px] top-[555px] w-[265px] h-[95px] rounded-full border-2 border-white/40 hover:border-[#38d9d2] hover:glow-cyan opacity-80 hover:opacity-100 pointer-events-auto flex items-center justify-center"><div class="bg-[#0d162fcc] text-white/90 font-bold text-lg px-4 py-1.5 rounded-full border border-white/20 -translate-y-16 flex items-center gap-2"><span class="">🌳</span><span class="">В тенёк</span></div></div></div>

    <!-- Bottom Voice Indicator -->
    
  </div>
