<!DOCTYPE html><html lang="ru" style=""><head>
  <meta charset="UTF-8">
  <title>FamilyTV — 2. Weather Lab Intro (Кубик льда)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #080d1e;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tv-stage {
      width: 1920px;
      height: 1080px;
      position: relative;
      background: #080d1e;
      overflow: hidden;
      box-sizing: border-box;
    }
    .glow-cyan {
      box-shadow: 0 0 50px rgba(56, 217, 210, 0.6), 0 0 100px rgba(56, 217, 210, 0.3);
    }
  </style>
</head>
<body style="width: 1920px; height: 1080px; max-width: 1920px; max-height: 1080px; overflow: hidden; margin: 0px auto; position: relative; background: rgb(8, 13, 30); display: flex; align-items: center; justify-content: center;">
  <div class="tv-stage flex flex-col justify-between p-[56px] relative select-none" style="width: 1920px; height: 1080px; max-width: 1920px; max-height: 1080px; overflow: hidden; margin: 0px auto; position: relative; background: rgb(8, 13, 30);">
    <!-- Lab Background -->
    <div class="absolute inset-0 z-0">
      <img src="https://lh3.googleusercontent.com/aida/AEtjO1XjwFBvbPLoUQPIC5DqtXjTP_LCr_RQAMrCwq-yTMKm91GY46dqsUM4mH2Lix5H_WavqlTxlZf31YZD_UoR6AYLvmhaiRx9y4tnFuFUXK0uHQh5gCJHdTUXNCQQyf_xMIdIc9FFdHI1Ink7T67tzHTg7_uG2ak_eZ3n4fbRehdpebrmHB8KhLJ7BVpkEW3Hr8BmWIEjhDeoFaOycnQXt2T9FR8WEYd6n9ksY68Heyuy7a3jT_rVAMu4NQ" alt="Weather Lab Intro" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-[#080d1e]/85 via-transparent to-[#080d1e]/70 pointer-events-none"></div>
    </div>

    <!-- Top Bar -->
    <div class="relative z-10 flex items-center justify-between w-full">
      <div class="flex items-center gap-3 bg-[#0d152bb3] backdrop-blur-md px-6 py-3.5 rounded-full border border-white/10 text-white/90 text-xl font-bold">
        <span class="text-2xl text-[#38d9d2]">‹</span> Назад в мир открытий
      </div>

      <!-- Lumi Question -->
      <div class="flex items-center gap-4 bg-[#0d152bfa] backdrop-blur-lg px-8 py-3.5 rounded-full border border-[#38d9d2]/40 shadow-[0_0_30px_rgba(56,217,210,0.25)]">
        <div class="w-10 h-10 rounded-full bg-[#38d9d2]/20 flex items-center justify-center text-2xl">🤖</div>
        <span class="text-white text-2xl font-bold tracking-wide">Луми: «Как думаешь, где лёд растает быстрее?»</span>
      </div>

      <div class="flex items-center gap-2 bg-[#0d152bb3] backdrop-blur-md px-5 py-3.5 rounded-full border border-white/10 text-[#ffd166] text-xl font-bold">
        <span class="">💡 Опыт №1</span>
      </div>
    </div>

    <!-- Center Callouts (Subtle overlay matching the physical locations in the art) -->
    <div class="relative z-10 flex justify-between items-center px-24 pointer-events-none">
      <!-- Left Sunny Spot -->
      <div class="flex items-center gap-3 bg-[#171e36cc] backdrop-blur-md border border-[#ffd166]/40 px-6 py-3 rounded-2xl text-[#ffd166] font-bold text-2xl shadow-lg">
        <span class="">☀️</span> Солнышко
      </div>

      <!-- Right Shade Spot -->
      <div class="flex items-center gap-3 bg-[#171e36cc] backdrop-blur-md border border-[#38d9d2]/40 px-6 py-3 rounded-2xl text-[#38d9d2] font-bold text-2xl shadow-lg">
        <span class="">🌳</span> Тенёк
      </div>
    </div>

    <!-- Bottom Focal Action -->
    <div class="relative z-10 flex flex-col items-center justify-center gap-3 pb-4">
      <div class="bg-[#38d9d2] text-[#080d1e] text-3xl font-black py-5 px-16 rounded-full flex items-center gap-4 glow-cyan scale-105 cursor-pointer">
        <span class="bg-[#080d1e] text-[#38d9d2] px-3.5 py-1 rounded-xl text-xl font-extrabold">OK</span>
        <span class="">Начать опыт</span>
      </div>
      
    </div>
  </div>



</body></html>
