<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=1920, height=1080, initial-scale=1.0" name="viewport"/>
<title>FamilyTV — Ракета и цвета</title>
<!-- Tailwind CSS v3 with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cosmic: {
              deep: '#0B0F2A',
              card: '#161D48',
              glow: '#38D9D2',
              ruby: '#F43F5E',
              cobalt: '#2563EB',
              amber: '#F59E0B'
            }
          },
          boxShadow: {
            'glow-cyan': '0 0 35px rgba(56, 217, 210, 0.75)',
            'glow-cyan-lg': '0 0 55px rgba(56, 217, 210, 0.95)',
            'inner-glow': 'inset 0 0 20px rgba(56, 217, 210, 0.3)'
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom TV Display Styles -->
<style data-purpose="tv-layout">
    /* Fixed 1080p TV layout constraints */
    html, body {
      width: 1920px;
      height: 1080px;
      min-width: 1920px;
      min-height: 1080px;
      max-width: 1920px;
      max-height: 1080px;
      overflow: hidden;
      user-select: none;
      background-color: #070A1E;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Cosmic animated stars in background */
    .star-bg {
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(56, 217, 210, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(37, 99, 235, 0.1) 0%, transparent 50%);
    }

    /* Pulse wave for speech audio indicator */
    @keyframes soundwave {
      0%, 100% { height: 8px; }
      50% { height: 26px; }
    }
    .wave-bar-1 { animation: soundwave 1.1s ease-in-out infinite; }
    .wave-bar-2 { animation: soundwave 0.8s ease-in-out infinite 0.2s; }
    .wave-bar-3 { animation: soundwave 1.3s ease-in-out infinite 0.4s; }
    .wave-bar-4 { animation: soundwave 0.9s ease-in-out infinite 0.1s; }

    /* Wing pulsing glow highlight */
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(56, 217, 210, 0.8), inset 0 0 15px rgba(56, 217, 210, 0.5);
        border-color: rgba(56, 217, 210, 0.9);
      }
      50% {
        box-shadow: 0 0 50px rgba(56, 217, 210, 1), inset 0 0 30px rgba(56, 217, 210, 0.8);
        border-color: #ffffff;
      }
    }
    .wing-glow {
      animation: pulseGlow 2.2s infinite ease-in-out;
    }
  </style>
<!-- END: Custom TV Display Styles -->
</head>
<body class="star-bg text-white flex flex-col justify-between relative box-border">
<!-- BEGIN: TV Safe Area Wrapper (88px horizontal, 72px vertical margin) -->
<div class="w-full h-full px-[88px] py-[72px] flex flex-col justify-between relative z-10" data-purpose="tv-safe-container">
<!-- BEGIN: TopHeader -->
<header class="w-full flex items-center justify-between h-[84px]" data-purpose="top-navigation-header">
<!-- Left: Back Navigation Button -->
<div class="flex items-center">
<button class="flex items-center gap-3 bg-[#1F2758]/80 hover:bg-[#2A3475] border-2 border-indigo-400/40 px-6 py-3.5 rounded-2xl text-2xl font-bold text-slate-100 shadow-lg tracking-wide transition-all">
<span class="text-3xl text-cyan-300 font-extrabold leading-none">‹</span>
<span>Назад</span>
</button>
</div>
<!-- Center: Lumi Prompt Speech Bubble -->
<div class="flex items-center bg-gradient-to-r from-[#172054] via-[#1E296D] to-[#172054] border-2 border-[#38D9D2]/70 shadow-glow-cyan px-7 py-3 rounded-full gap-5 max-w-[880px]" data-purpose="lumi-prompt-bubble">
<!-- Robot Lumi Avatar -->
<div class="relative w-14 h-14 rounded-full bg-cyan-950 border-2 border-cyan-400 flex items-center justify-center shrink-0 shadow-md">
<svg class="w-8 h-8 text-cyan-300" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.72V7h4a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3h4V5.72c-.6-.34-1-.98-1-1.72a2 2 0 0 1 2-2m-3 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m-6.5 5.5a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1h-7z"></path>
</svg>
<span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-green-400 border-2 border-[#172054] rounded-full animate-ping"></span>
</div>
<!-- Speech Prompt Text -->
<div class="text-[23px] font-semibold text-white tracking-wide">
<span class="text-cyan-300 font-bold">Робот Люми:</span> «Покрась крыло ракеты в синий цвет!»
        </div>
<!-- Interactive Voice Waves -->
<div class="flex items-center gap-1.5 h-7 pl-2 shrink-0">
<div class="w-1.5 bg-cyan-300 rounded-full wave-bar-1"></div>
<div class="w-1.5 bg-cyan-400 rounded-full wave-bar-2"></div>
<div class="w-1.5 bg-teal-300 rounded-full wave-bar-3"></div>
<div class="w-1.5 bg-cyan-200 rounded-full wave-bar-4"></div>
</div>
</div>
<!-- Right: Progress & Voice Status -->
<div class="flex items-center gap-4">
<!-- Progress Counter -->
<div class="bg-[#1C2456] border-2 border-indigo-400/40 px-5 py-3 rounded-2xl text-xl font-bold text-indigo-100 flex items-center gap-2">
<span class="text-amber-400">★</span>
<span>Задание 3 из 5</span>
</div>
<!-- Voice Indicator Badge -->
<div class="bg-cyan-950/80 border-2 border-cyan-400/60 px-4 py-3 rounded-2xl text-xl font-semibold text-cyan-300 flex items-center gap-2 shadow-inner">
<span class="text-2xl">🎤</span>
<span>Голос</span>
</div>
</div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: CenterStage (Rocket Diorama) -->
<main class="w-full flex-1 my-4 flex items-center justify-center relative" data-purpose="center-stage-diorama">
<div class="relative w-[1380px] h-[550px] rounded-3xl overflow-hidden border-4 border-indigo-400/40 shadow-2xl bg-[#0F1538]">
<!-- Primary Illustration Image -->
<img alt="Ракета на космодроме с роботом Люми" class="w-full h-full object-cover select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida/AEtjO1Wjr8nIeMxdxpkmGu9eiQnWetNq8pDryiaPy_MkWPWS1mcbYIPmTO_p0osrjEvW0EXAX5kg-Vnxlr46RTOUN8aFsJW2cGdehIx913O6JAgJ22t1dFtasETgITYoKTGhk24ciYsPNrf0Zl_pC8x5Oo1W9Xd-180z9LOx4HZNQKfseNxTaoBXov3jUhHWivnsngkfAZYcCZyUN00Vsx3vCrqsaMxXtVY7D8uDsUVQqgfWRj7NmXMEYOVDuS8"/>
<!-- Soft Vignette Overlay for TV Screen Depth -->
<div class="absolute inset-0 bg-gradient-to-t from-[#0B0F2A]/70 via-transparent to-transparent pointer-events-none"></div>
<!-- Right Wing Target Interactive Callout -->
<div class="absolute top-[220px] left-[895px] flex flex-col items-center pointer-events-none z-20">
<!-- Animated Starlight Indicator Ring -->
<div class="w-36 h-48 rounded-[40px] border-4 border-dashed border-cyan-300 wing-glow bg-cyan-400/15 flex items-center justify-center backdrop-blur-xs">
<!-- Pulsing Center Star -->
<div class="w-8 h-8 rounded-full bg-cyan-300 flex items-center justify-center shadow-glow-cyan text-blue-950 font-black text-xl">
              ★
            </div>
</div>
<!-- Wing Goal Tag Badge -->
<div class="mt-3 bg-cyan-900/95 border-2 border-cyan-300 text-cyan-100 font-extrabold text-lg px-4 py-1.5 rounded-full shadow-glow-cyan flex items-center gap-2 tracking-wide">
<span class="inline-block w-3 h-3 rounded-full bg-blue-500 border border-white"></span>
<span>Нужен синий цвет</span>
</div>
</div>
</div>
</main>
<!-- END: CenterStage -->
<!-- BEGIN: BottomControls (Tactile Paint Swatches & Remote Hints) -->
<footer class="w-full flex flex-col gap-3" data-purpose="bottom-controls-section">
<div class="w-full flex items-center justify-between px-2">
<!-- Left: Voice Fallback Hint -->
<div class="w-[320px] flex items-center gap-3 bg-[#131B45]/90 border border-indigo-400/30 px-5 py-3.5 rounded-2xl shadow-md">
<span class="text-3xl text-cyan-300">🎤</span>
<div class="text-left leading-tight">
<p class="text-sm font-medium text-slate-400 uppercase tracking-wider">Голосовая команда</p>
<p class="text-xl font-bold text-white">Скажи в пульт: <span class="text-cyan-300">«Синий»</span></p>
</div>
</div>
<!-- Center: 3 Tactile Paint Jar Swatches -->
<div class="flex items-center gap-7" data-purpose="paint-jars-selection">
<!-- Red Paint Jar Card (Inactive) -->
<div class="w-[240px] h-[160px] rounded-2xl bg-[#182152]/90 border-2 border-indigo-500/40 p-3.5 flex flex-col items-center justify-between opacity-80 hover:opacity-100 transition-all">
<div class="flex items-center gap-3 mt-1">
<div class="w-10 h-10 rounded-full bg-rose-600 border-2 border-rose-300 shadow-md"></div>
<span class="text-2xl font-black text-slate-100 tracking-wide">Красный</span>
</div>
<!-- Visual Paint Dripping Tube representation -->
<div class="w-full bg-slate-900/60 h-8 rounded-xl flex items-center justify-center border border-rose-500/30">
<div class="w-3/4 h-3 bg-rose-500 rounded-full"></div>
</div>
<span class="text-sm font-semibold text-slate-400">Нажмите ◄ для выбора</span>
</div>
<!-- Blue Paint Jar Card (ACTIVE D-PAD FOCUS) -->
<div class="relative w-[280px] h-[184px] -translate-y-2 rounded-2xl bg-gradient-to-b from-[#1C2C77] to-[#131F58] border-4 border-[#38D9D2] p-4 flex flex-col items-center justify-between scale-105 shadow-glow-cyan-lg z-30 transition-transform" data-purpose="focused-dpad-card">
<!-- Active Remote Badge -->
<div class="absolute -top-4 bg-[#38D9D2] text-[#071330] font-black text-xs px-4 py-1 rounded-full uppercase tracking-widest shadow-lg">
              ВЫБРАНО ПУЛЬТОМ
            </div>
<!-- Jar Label & Swatch -->
<div class="flex items-center gap-3.5 mt-2">
<div class="w-12 h-12 rounded-full bg-blue-600 border-3 border-cyan-200 shadow-glow-cyan flex items-center justify-center text-white text-xl font-bold">
                ✓
              </div>
<span class="text-3xl font-black text-white tracking-wider">Синий</span>
</div>
<!-- Tactile Paint Gauge -->
<div class="w-full bg-blue-950/80 h-9 rounded-xl flex items-center justify-center border-2 border-cyan-400/50 shadow-inner">
<div class="w-4/5 h-4 bg-blue-500 rounded-full shadow-[0_0_10px_#3b82f6]"></div>
</div>
<!-- Active Confirmation Button -->
<button class="w-full py-2 bg-gradient-to-r from-teal-400 to-cyan-400 text-slate-950 font-extrabold text-lg rounded-xl shadow-lg flex items-center justify-center gap-2">
<span class="bg-slate-900 text-cyan-300 px-2 py-0.5 rounded text-sm font-black">[ OK ]</span>
<span>Покрасить</span>
</button>
</div>
<!-- Yellow Paint Jar Card (Inactive) -->
<div class="w-[240px] h-[160px] rounded-2xl bg-[#182152]/90 border-2 border-indigo-500/40 p-3.5 flex flex-col items-center justify-between opacity-80 hover:opacity-100 transition-all">
<div class="flex items-center gap-3 mt-1">
<div class="w-10 h-10 rounded-full bg-amber-400 border-2 border-amber-200 shadow-md"></div>
<span class="text-2xl font-black text-slate-100 tracking-wide">Жёлтый</span>
</div>
<!-- Visual Paint Dripping Tube representation -->
<div class="w-full bg-slate-900/60 h-8 rounded-xl flex items-center justify-center border border-amber-400/30">
<div class="w-3/4 h-3 bg-amber-400 rounded-full"></div>
</div>
<span class="text-sm font-semibold text-slate-400">Нажмите ► для выбора</span>
</div>
</div>
<!-- Right: Secondary Actions (Hints & Repeat) -->
<div class="w-[320px] flex flex-col gap-2.5">
<button class="w-full flex items-center justify-between bg-[#172153]/80 hover:bg-[#202D6E] border border-indigo-400/30 px-5 py-2.5 rounded-xl text-lg font-bold text-slate-200 transition-colors">
<span class="flex items-center gap-2">
<span class="text-yellow-300 text-xl">💡</span>
<span>Подсказка</span>
</span>
<span class="bg-indigo-950 border border-indigo-400/50 text-indigo-300 text-sm px-2.5 py-1 rounded-md font-mono">▲ Вверх</span>
</button>
<button class="w-full flex items-center justify-between bg-[#172153]/80 hover:bg-[#202D6E] border border-indigo-400/30 px-5 py-2.5 rounded-xl text-lg font-bold text-slate-200 transition-colors">
<span class="flex items-center gap-2">
<span class="text-cyan-300 text-xl">🔊</span>
<span>Повторить</span>
</span>
<span class="bg-indigo-950 border border-indigo-400/50 text-indigo-300 text-sm px-2.5 py-1 rounded-md font-mono">▼ Вниз</span>
</button>
</div>
</div>
<!-- BEGIN: Bottom Remote Bar (10-Foot UI Assistance Footer) -->
<div class="w-full h-[42px] bg-[#0A0E29]/90 border-t border-indigo-500/25 flex items-center justify-center gap-10 text-slate-300 text-base font-medium rounded-lg" data-purpose="remote-legend-bar">
<div class="flex items-center gap-2">
<span class="bg-slate-800 border border-slate-600 px-2 py-0.5 rounded text-xs font-bold text-cyan-300">◄ ►</span>
<span>Выбор цвета</span>
</div>
<span class="text-slate-600">•</span>
<div class="flex items-center gap-2">
<span class="bg-slate-800 border border-slate-600 px-2 py-0.5 rounded text-xs font-bold text-emerald-300">[ OK ]</span>
<span>Покрасить</span>
</div>
<span class="text-slate-600">•</span>
<div class="flex items-center gap-2">
<span class="bg-slate-800 border border-slate-600 px-2 py-0.5 rounded text-xs font-bold text-amber-300">▲</span>
<span>Подсказка</span>
</div>
<span class="text-slate-600">•</span>
<div class="flex items-center gap-2">
<span class="bg-slate-800 border border-slate-600 px-2 py-0.5 rounded text-xs font-bold text-purple-300">🎤</span>
<span>Голос</span>
</div>
</div>
<!-- END: Bottom Remote Bar -->
</footer>
<!-- END: BottomControls -->
</div>
<!-- END: TV Safe Area Wrapper -->
</body></html>
